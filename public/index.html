<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aura – AI Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%237c5cff'/%3E%3Cpath d='M16 6l2.5 7.5L26 16l-7.5 2.5L16 26l-2.5-7.5L6 16l7.5-2.5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth" class="auth" hidden></div>
<div id="deck" class="deck" hidden></div>
<div class="app">
  <aside id="side">
    <div class="brand"><span class="logo"></span>Aura</div>
    <button id="new" class="new">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> New chat
    </button>
    <div id="list" class="list"></div>
    <div id="user" class="userbox" hidden><span id="userEmail"></span><button id="logout" class="mini" title="Log out">Log out</button></div>
    <button id="auto" class="ghost" title="Read every new reply out loud">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>
      <span id="autoLabel">Auto-read replies: Off</span>
    </button>
    <button id="theme" class="ghost">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span id="themeLabel">Light mode</span>
    </button>
  </aside>
  <div id="scrim"></div>
  <main>
    <header>
      <button id="menu" class="icon" aria-label="Menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <span id="title">New chat</span>
    </header>
    <div id="scroll"><div id="msgs"></div></div>
    <footer>
      <div id="mode" class="chip" hidden></div>
      <div id="chip" class="chip" hidden></div>
      <div class="box">
        <div id="tools" class="tools" hidden></div>
        <input type="file" id="file" hidden accept=".txt,.md,.csv,.json,.js,.ts,.py,.html,.css,.java,.c,.cpp,.cs,.go,.rs,.sql">
        <button id="attach" class="icon" aria-label="Attach text file" title="Attach a text or code file"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 01-7.8-7.8l8.6-8.6a3.7 3.7 0 015.2 5.2l-8.6 8.6a1.8 1.8 0 01-2.6-2.6l7.9-7.9"/></svg></button>
        <button id="toolbtn" class="icon" aria-label="Tools" title="Tools and modes"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg></button>
        <textarea id="input" rows="1" placeholder="Message Aura…" autofocus></textarea>
        <button id="mic" class="icon" aria-label="Voice input" title="Speak your message"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
        <button id="send" class="send" aria-label="Send"></button>
      </div>
      <p class="note">Aura can make mistakes. Double-check important information.</p>
    </footer>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
